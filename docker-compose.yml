services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: krishok_sheba
      POSTGRES_USER: krishok
      POSTGRES_PASSWORD: krishok_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishok -d krishok_sheba"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
